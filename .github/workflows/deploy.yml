name: Deploy

# Ships the website and Storybook to Vercel whenever main changes, so a merged PR goes live
# without anyone running `vercel` by hand. Needs these repository secrets:
#   VERCEL_TOKEN                  a token from https://vercel.com/account/tokens
#   VERCEL_ORG_ID                 the team (or personal account) id, from .vercel/project.json after `vercel link`
#   VERCEL_SITE_PROJECT_ID        the bakesbymom-site project id
#   VERCEL_STORYBOOK_PROJECT_ID   the bakesbymom-gilt (Storybook) project id
# Until they are set, the jobs skip instead of failing.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy ${{ matrix.target }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ matrix.target }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: website
            project: VERCEL_SITE_PROJECT_ID
          - target: storybook
            project: VERCEL_STORYBOOK_PROJECT_ID
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets[matrix.project] }}
    steps:
      - name: Check the Vercel secrets
        id: secrets
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::Vercel secrets for the ${{ matrix.target }} are not set, skipping the deploy."
          fi
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.secrets.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      # Vercel builds with the project's own settings (root directory and vercel.json), same as a manual deploy.
      - if: steps.secrets.outputs.ready == 'true'
        run: npx --yes vercel@latest deploy --prod --yes --token="$VERCEL_TOKEN"

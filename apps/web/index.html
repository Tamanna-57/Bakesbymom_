    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Bakes by Mom" />
    <meta property="og:title" content="Bakes by Mom · Eggless cakes and bakes in Panipat" />
    <meta
      property="og:description"
      content="Eggless cakes, brownies, cookies, cupcakes and bento cakes, baked to order. Order on WhatsApp."
    />
    <meta property="og:url" content="%SITE_URL%/" />
    <meta property="og:image" content="%SITE_URL%/photos/choco-drip-1.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="%SITE_URL%/" />
    <meta name="theme-color" content="#fbf7ef" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&family=Cherry+Bomb+One&family=DM+Sans:ital,opsz,wght@0,9..40,400..900;1,9..40,400..900&family=Fraunces:ital,opsz,wght,SOFT,WONK@0,9..144,300..900,0..100,0..1;1,9..144,300..900,0..100,0..1&family=Pinyon+Script&display=swap"
    />
    <style>
      html.fonts-pending body {
        opacity: 0;
      }
      body {
        transition: opacity 0.4s ease;
      }
    </style>
    <script>
      // Hold the page back until its fonts arrive (at most 1.5s), so it never flashes in fallback type.
      (function () {
        if (!document.fonts || !document.fonts.load) return;
        var root = document.documentElement;
        var show = function () {
          root.classList.remove('fonts-pending');
        };
        root.classList.add('fonts-pending');
        var faces = ['400 1em "Pinyon Script"', '600 1em Fraunces', '400 1em "DM Sans"', '400 1em Caveat'];
        Promise.race([
          Promise.all(faces.map((face) => document.fonts.load(face))),
          new Promise((resolve) => setTimeout(resolve, 1500)),
        ]).then(show, show);
      })();
    </script>
  </head>
  <body class="bbm-theme">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
